# 文件名：model_config.yaml 职责：AI 引擎模型路由配置,定义 Qwen-7B 主模型、ChatGLM3 降级模型与 mock 兜底的三档路由及超时熔断策略
#
# 三档兜底策略:
#   主模型:  Qwen-7B (本地 vLLM 部署, localhost:8000)
#   降级模型: ChatGLM3 (本地 vLLM 部署, localhost:8001)
#   最终兜底: mock (占位提示, 保证业务不中断)
#
# 触发条件:
#   - 主模型 HTTP 调用超时 (>2s) → 切换降级模型
#   - 降级模型同样超时 / 网络异常 → 走 mock
#   - 主模型连续失败触发熔断 → 直接走降级模型
#
# 测试: backend/tests/test_infra_config.py::test_model_config_has_3_tier_fallback
# 设计依据: ROADMAP_REMAINING_V2.md R4.2 + ai-engine/services/llm_service.py

# === 模型路由表 (按优先级) ===
routing:
  primary:
    name: "qwen-7b"
    provider: "vllm"
    base_url: "http://localhost:8000/v1"
    endpoint: "/chat/completions"
    api_key: ""                          # 本地部署, 不需要鉴权
    timeout_seconds: 2                  # 主模型 2s 超时, 超时立即降级
    fallback_on_status: [500, 502, 503, 504]
    weight: 100

  fallback:
    name: "chatglm3"
    provider: "vllm"
    base_url: "http://localhost:8001/v1"
    endpoint: "/chat/completions"
    api_key: ""
    timeout_seconds: 2                  # 降级模型同样 2s 超时, 超时走 mock
    fallback_on_status: [500, 502, 503, 504]
    weight: 50

  mock:
    name: "mock-fallback"
    provider: "mock"
    enabled: true
    response_template: "AI 引擎暂不可用, 已降级返回 mock 结果"

# === 推理默认参数 ===
inference:
  temperature: 0.3                      # 评分/分析场景需稳定输出, 温度低
  max_tokens: 2048
  top_p: 0.9
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop: []

# === Embedding 服务 (语义检索 / 风控特征) ===
embedding:
  model_name: "bge-large-zh-v1.5"
  base_url: "http://localhost:8002"
  endpoint: "/embed"
  api_key: ""
  timeout_seconds: 5
  dimension: 1024

# === 熔断 / 重试 ===
circuit_breaker:
  failure_threshold: 5                  # 连续 5 次失败开启熔断
  cooldown_seconds: 60                  # 60s 内走降级模型, 不再尝试主模型
  half_open_max_attempts: 1             # 半开态最多尝试 1 次

retry:
  max_attempts: 2                        # 2 次 (含首次), 超过则降级
  backoff_ms: 100                        # 指数退避基数 100ms
  backoff_max_ms: 1000

# === 降级监控 / 告警 ===
monitoring:
  metrics_enabled: true
  prometheus_port: 8000
  prometheus_path: /metrics
  alert_on_fallback: true               # 触发降级时打 warning 日志
  alert_on_mock: true                   # 走 mock 时打 error 日志
