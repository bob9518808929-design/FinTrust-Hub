# 文件名：api_adapter_credentials.yaml 职责：15 个外部 API 适配器凭证环境变量映射,指导凭证加载与未配置时降级 mock 的逻辑
#
# 用途: services.api_adapter_registry._load_real_credentials() 据此加载凭证.
# 设计:
#   - 每个适配器列出真实 API 调用所需的环境变量键
#   - 全部未配置时 (默认开发环境), _call_real_api 返回 None 触发 mock 降级
#   - 真实环境通过 .env / Docker env 注入

adapters:
  A1_BANK_ICBC:
    name: 工商银行银企直连
    env:
      api_url: BANK_API_001_URL
      app_id: BANK_API_001_APP_ID
      app_secret: BANK_API_001_APP_SECRET
      cert_path: BANK_API_001_CERT_PATH
      cert_password: BANK_API_001_CERT_PASSWORD
    required: [api_url, app_id, app_secret]

  A2_BANK_CMB:
    name: 招商银行银企直连
    env:
      api_url: BANK_API_002_URL
      app_id: BANK_API_002_APP_ID
      app_secret: BANK_API_002_APP_SECRET
      cert_path: BANK_API_002_CERT_PATH
      cert_password: BANK_API_002_CERT_PASSWORD
    required: [api_url, app_id, app_secret]

  A3_TAX_INVOICE:
    name: 国税总局发票查验
    env:
      api_url: TAX_API_URL
      api_key: TAX_API_KEY
    required: [api_url, api_key]

  A4_GSXT:
    name: 国家企业信用信息公示系统
    env:
      api_url: GSXT_API_URL
      api_key: GSXT_API_KEY
    required: [api_url, api_key]

  A5_JUDICIARY:
    name: 中国裁判文书网 / 执行信息公开网
    env:
      api_url: JUDICIARY_API_URL
      api_key: JUDICIARY_API_KEY
    required: [api_url, api_key]

  A6_ECDS:
    name: 电子商业汇票系统 (票交所)
    env:
      api_url: ECDS_API_URL
      api_key: ECDS_API_KEY
      member_id: ECDS_MEMBER_ID
    required: [api_url, api_key, member_id]

  A7_OCR_BAIDU:
    name: 百度智能云 OCR
    env:
      api_key: BAIDU_OCR_API_KEY
      secret_key: BAIDU_OCR_SECRET_KEY
      endpoint: BAIDU_OCR_ENDPOINT
    required: [api_key, secret_key]

  A8_OCR_ALI:
    name: 阿里云 OCR
    env:
      access_key_id: ALIYUN_OCR_ACCESS_KEY_ID
      access_key_secret: ALIYUN_OCR_ACCESS_KEY_SECRET
      endpoint: ALIYUN_OCR_ENDPOINT
    required: [access_key_id, access_key_secret]

  A9_MQTT_EMQX:
    name: EMQX MQTT Broker
    env:
      host: EMQX_HOST
      port: EMQX_PORT
      username: EMQX_USERNAME
      password: EMQX_PASSWORD
    required: [host, port]

  A10_ES:
    name: ElasticSearch
    env:
      host: ES_HOST
      port: ES_PORT
      username: ES_USERNAME
      password: ES_PASSWORD
      index: ES_INDEX
    required: [host, port]

  A11_TEMPORAL:
    name: Temporal Workflow Engine
    env:
      host: TEMPORAL_HOST
      namespace: TEMPORAL_NAMESPACE
      api_key: TEMPORAL_API_KEY
    required: [host, namespace]

  A12_HE_SEAL:
    name: 同态加密服务 (HE-SEAL)
    env:
      api_url: HE_SEAL_API_URL
      api_key: HE_SEAL_API_KEY
    required: [api_url, api_key]

  A13_GOVERNMENT_PURGE:
    name: 政务数据 purge 接口
    env:
      api_url: GOV_PURGE_API_URL
      api_key: GOV_PURGE_API_KEY
      org_code: GOV_PURGE_ORG_CODE
    required: [api_url, api_key, org_code]

  A14_ANT_CHAIN:
    name: 蚂蚁链 (联盟链存证)
    env:
      endpoint: ANT_CHAIN_ENDPOINT
      access_key: ANT_CHAIN_ACCESS_KEY
      secret: ANT_CHAIN_SECRET
    required: [endpoint, access_key, secret]

  A15_ZHIXIN_CHAIN:
    name: 至信链 (联盟链存证)
    env:
      endpoint: ZXIN_CHAIN_ENDPOINT
      access_key: ZXIN_CHAIN_ACCESS_KEY
      secret: ZXIN_CHAIN_SECRET
    required: [endpoint, access_key, secret]

# === 调用真实 API 的全局超时 ===
real_api_timeout_ms: 5000
