# ====================================================================
# 2. CACert 客户端证书 (mTLS, 路径占位)
# ====================================================================

# 真实部署启用 mTLS 时, EMQX listener.ssl.external.ssl_options 配置:
#   keyfile:  /opt/emqx/etc/certs/server.key
#   certfile: /opt/emqx/etc/certs/server.crt
#   cacertfile: /opt/emqx/etc/certs/ca.crt
#   verify: verify_peer
#   fail_if_no_peer_cert: true
#
# CACert 路径 (设备端):
#   device_cert_dir: /opt/emqx/etc/certs/devices/
#   ca_cert: /opt/emqx/etc/certs/ca.crt
#
# 客户端证书 CN 命名规范 (与 username 对齐):
#   CN=device_e001_001, O=FinTrust, OU=IoT-Gateway-E001

# ====================================================================
# 3. JWT 认证 (可选, 与企业业务系统 SSO 对接)
# ====================================================================

# 真实部署启用 JWT 时, 在 mqtt_config.yaml.authentication 添加:
#   - mechanism: jwt
#     backend: local
#     secret: ${EMQX_JWT_SECRET}
#     from: token_field  # JWT 中提取 device_id 的字段名
#     verify_claims:
#       - field: exp
#         required: true
#
# 设备登录时通过业务系统签发 JWT (含 device_id + enterprise_id + 过期时间),
# 设备用 JWT 作为 MQTT password 接入.
