# EMQX 5.0 设备认证配置 (DATA-04 R7.0)
#
# 设备认证策略:
#   1. username + password (内置 SHA256 + salt 后缀哈希)
#   2. CACert 客户端证书 (mTLS, 真实部署切换为 cert-based auth)
#   3. JWT (可选, 与企业业务系统 SSO 对接)
#
# 文件用途:
#   - 作为 EMQX bootstrap_file 启动时初始化 device 用户表
#   - 真实部署通过 Dashboard / HTTP API 添加更多设备
#   - 此文件被 docker-compose 挂载到 /opt/emqx/etc/device_auth.conf
#
# 安全说明:
#   - 种子设备密码均为占位 (FinTrust-Device-Seed-XXXX), 真实部署必须修改
#   - CACert 路径默认指向容器内 /opt/emqx/etc/certs/, 由 docker volume 挂载

