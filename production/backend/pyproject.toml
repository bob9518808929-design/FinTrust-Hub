[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrust-hub-backend"
version = "3.1.0"
description = "FinTrust Hub v3.1 生产系统后端 - FastAPI + Spring Cloud (Java 部分独立仓库)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FinTrust Hub Team" }]

dependencies = [
    # Web 框架
    "fastapi[all]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # 数据库 ORM + 迁移
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "greenlet>=3.0.3",

    # 缓存 / 消息队列
    "redis[hiredis]>=5.0.3",
    "kafka-python>=2.0.2",
    "aio-pika>=9.4.0",

    # 数据校验
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",

    # 时序数据库 / 图数据库
    "clickhouse-connect>=0.7.1",
    "neo4j>=5.19.0",

    # AI / LLM
    "openai>=1.14.0",
    "anthropic>=0.21.0",
    "tiktoken>=0.6.0",
    "scikit-learn>=1.4.1",
    "xgboost>=2.0.3",
    "pandas>=2.2.1",

    # 加密
    "cryptography>=42.0.5",
    "pycryptodome>=3.20.0",
    "pyjwt[crypto]>=2.8.0",

    # OCR / RPA
    "paddleocr>=2.7.0",
    "pdfplumber>=0.10.2",
    "reportlab>=4.0.9",
    "pypdf>=4.0.0",

    # 工作流编排
    "temporalio>=1.4.0",
    "apscheduler>=3.10.4",

    # 区块链 SDK
    "antsdk>=1.0.0",

    # HTTP 客户端
    "httpx>=0.27.0",
    "aiohttp>=3.9.3",

    # 工具
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "rich>=13.7.1",
    "orjson>=3.9.15",
    "python-dateutil>=2.9.0",
    "tenacity>=8.2.3",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "types-python-dateutil>=2.9.0",
    "ipython>=8.22.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
