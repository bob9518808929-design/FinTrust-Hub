# Alembic 配置 (生产环境数据库迁移)
# 使用: cd backend && alembic upgrade head

[alembic]
script_location = ../db/migrations
sqlalchemy.url = postgresql+asyncpg://fintrust:fintrust@localhost:5432/fintrust_hub

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
