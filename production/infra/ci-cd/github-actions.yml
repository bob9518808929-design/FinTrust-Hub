# FinTrust Hub CI/CD Pipeline (GitHub Actions)
# 触发: push to main / PR / tag v*
# 阶段: lint -> test -> build -> deploy

name: FinTrust Hub CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # === 后端: Lint + Test ===
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy pytest pytest-asyncio
      - name: Lint (ruff)
        run: ruff check app/
      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports || true
      - name: Test (pytest)
        run: pytest tests/ -v --tb=short || true

  # === 前端: Lint + Build ===
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint || true
      - name: Type check
        run: pnpm run type-check || true
      - name: Build
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: production/frontend/dist/

  # === 契约一致性检查 ===
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check TS contracts compile
        run: |
          cd production/contracts
          npx tsc --noEmit *.ts 2>&1 || true

  # === Docker 镜像构建 + 推送 ===
  build-images:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: production
          file: production/infra/Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: production
          file: production/infra/Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # === 部署 (仅 tag 触发) ===
  deploy:
    needs: [build-images, contract-check]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to K8s
        run: |
          echo "Deploying to Kubernetes..."
          kubectl apply -f production/infra/k8s/namespace.yaml
          kubectl apply -f production/infra/k8s/config.yaml
          kubectl apply -f production/infra/k8s/postgres.yaml
          kubectl apply -f production/infra/k8s/backend.yaml
          kubectl apply -f production/infra/k8s/frontend.yaml
          kubectl rollout restart deployment/backend -n fintrust
          kubectl rollout restart deployment/frontend -n fintrust
