# 文件名：docker-compose.logging.yml 职责：日志采集栈编排,启动 Loki + Promtail + Grafana 容器并挂载配置
# 用法:
#   cd production/infra/observability/loki-promtail
#   docker compose -f docker-compose.logging.yml up -d
#   open http://localhost:3000  (Grafana admin/admin)

services:
  loki:
    image: grafana/loki:2.9.10
    container_name: fintrust-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki.yaml"
      - "-ruler.rule-path=/tmp/loki/rules"
    ports:
      - "3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - ./loki-alerting-rules.yml:/tmp/loki/rules/fintrust-llm-p0.yml:ro
      - loki-data:/loki
    networks: [fintrust-obs]

  promtail:
    image: grafana/promtail:2.9.10
    container_name: fintrust-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../../backend/logs:/var/log/fintrust:ro
    depends_on: [loki]
    networks: [fintrust-obs]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fintrust-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    networks: [fintrust-obs]

volumes:
  loki-data:
    name: fintrust-loki-data
  grafana-data:
    name: fintrust-grafana-data

networks:
  fintrust-obs:
    name: fintrust-obs
    driver: bridge
