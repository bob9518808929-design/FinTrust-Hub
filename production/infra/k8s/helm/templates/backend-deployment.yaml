{{/* 文件名：backend-deployment.yaml 职责：后端 Helm 模板,部署 FastAPI Deployment/Service 并配置健康探针与 HPA
*/}}
{{- if .Values.backend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fintrust-hub.fullname" . }}-backend
  namespace: {{ include "fintrust-hub.namespace" . }}
  labels:
    {{- include "fintrust-hub.labels" (set . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas | default 3 }}
  selector:
    matchLabels:
      {{- include "fintrust-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "fintrust-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          {{- include "fintrust-hub.image" (set . "image" .Values.backend.image) | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port | default 8000 }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "fintrust-hub.fullname" . }}-config
            - secretRef:
                name: {{ .Values.dbCredentials.secretName | default "db-secrets" }}
          env:
            # 注入 Pod 元数据, 便于日志/链路追踪
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POSTGRES_HOST
              value: {{ include "fintrust-hub.fullname" . }}-postgres
            - name: REDIS_HOST
              value: {{ include "fintrust-hub.fullname" . }}-redis
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fintrust-hub.fullname" . }}-backend
  namespace: {{ include "fintrust-hub.namespace" . }}
  labels:
    {{- include "fintrust-hub.labels" (set . "component" "backend") | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  selector:
    {{- include "fintrust-hub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port | default 8000 }}
      targetPort: http
      protocol: TCP
{{- end }}
