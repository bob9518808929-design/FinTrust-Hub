{{/* 文件名：frontend-deployment.yaml 职责：前端 Helm 模板,部署 Nginx 静态资源 Deployment/Service 并由 / Ingress 路由
*/}}
{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fintrust-hub.fullname" . }}-frontend
  namespace: {{ include "fintrust-hub.namespace" . }}
  labels:
    {{- include "fintrust-hub.labels" (set . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "fintrust-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "fintrust-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          {{- include "fintrust-hub.image" (set . "image" .Values.frontend.image) | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port | default 80 }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: "/"
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/"
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fintrust-hub.fullname" . }}-frontend
  namespace: {{ include "fintrust-hub.namespace" . }}
  labels:
    {{- include "fintrust-hub.labels" (set . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type | default "ClusterIP" }}
  selector:
    {{- include "fintrust-hub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port | default 80 }}
      targetPort: http
      protocol: TCP
{{- end }}
