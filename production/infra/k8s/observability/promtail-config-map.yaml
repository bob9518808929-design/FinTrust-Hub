# 文件名：promtail-config-map.yaml 职责：生产日志采集 ConfigMap,提供 Promtail 抓取容器日志并推送 Loki 的配置
# 部署方式: 用 Helm chart grafana/loki-stack, 此 ConfigMap 作为 promtail.config
#
# kubectl apply -f promtail-config-map.yaml -n fintrust
#
# 或通过 Helm values 覆盖:
#   promtail:
#     configMap: promtail-config

apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: fintrust
  labels:
    app: promtail
    component: observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: fintrust-backend
        kubernetes_sd_configs:
          - role: pod
            selectors:
              - role: pod
                label: app=backend
                namespace: fintrust
        relabel_configs:
          - source_labels: ['__meta_kubernetes_pod_name']
            target_label: pod
          - source_labels: ['__meta_kubernetes_namespace']
            target_label: namespace
          - target_label: service
            replacement: backend
        pipeline_stages:
          - json:
              expressions:
                level: record.level.name
                logger: record.name
                line: record.line
                message: record.message
          - labels:
              level:
              logger:
              line:

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: fintrust
  labels:
    app: loki
    component: observability
data:
  fintrust-llm-p0.yaml: |
    groups:
      - name: fintrust-llm-p0
        interval: 30s
        rules:
          - alert: LLMRateLimitTriggered
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.llm_service"}
                  | line == "161"
                  | regexp("LLM 限流触发")
                  [1m]
                )
              ) > 5
            for: 1m
            labels:
              severity: warning
              category: llm
              fingerprint: LLM_LIMIT_TRIGGER
            annotations:
              summary: "DeepSeek 模块限流触发"
              description: "过去 1 分钟内出现 {{ $value }} 次限流兜底"

          - alert: LLMRateLimitDegrade
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.redis_client"}
                  | line == "87"
                  | regexp("Redis 不可用.*限流降级放行")
                  [5m]
                )
              ) > 0
            for: 30s
            labels:
              severity: critical
              category: llm
              fingerprint: LLM_RATE_DEGRADE
            annotations:
              summary: "Redis 不可用, LLM 限流降级放行"
              description: "限流失效, DeepSeek API 直接被打爆风险"

          - alert: LLMCircuitBreakerOpen
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.llm_service"}
                  | line == "105"
                  | regexp("LLM 熔断器开启/续期")
                  [5m]
                )
              ) > 0
            for: 30s
            labels:
              severity: critical
              category: llm
              fingerprint: LLM_CB_OPEN
            annotations:
              summary: "DeepSeek 熔断器开启"

          - alert: LLMCircuitBreakerFallback
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.llm_service"}
                  | line == "201"
                  | regexp("LLM 走熔断兜底")
                  [1m]
                )
              ) > 50
            for: 2m
            labels:
              severity: warning
              category: llm
              fingerprint: LLM_CB_FALLBACK
            annotations:
              summary: "DeepSeek 熔断期间大量请求走兜底"

          - alert: LLMCircuitBreakerRecovered
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.llm_service"}
                  | line == "95"
                  | regexp("LLM 熔断器已恢复")
                  [5m]
                )
              ) > 0
            for: 0m
            labels:
              severity: info
              category: llm
              fingerprint: LLM_CB_RECOVERED
            annotations:
              summary: "DeepSeek 熔断器已恢复"
              description: "cooldown 过后第一次调用成功"

          - alert: LLMCallFailed
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.llm_service"}
                  | line == "254"
                  | regexp("LLM 调用失败")
                  [1m]
                )
              ) > 10
            for: 1m
            labels:
              severity: warning
              category: llm
              fingerprint: LLM_CALL_FAILED
            annotations:
              summary: "DeepSeek 调用失败率上升"

          - alert: LLMRedisOpDegrade
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.redis_client"}
                  | line == "108"
                  | regexp("Redis 操作异常.*限流降级放行")
                  [5m]
                )
              ) > 0
            for: 30s
            labels:
              severity: critical
              category: llm
              fingerprint: LLM_REDIS_OP_DEGRADE
            annotations:
              summary: "Redis 操作异常, 限流降级放行"
              description: "Redis 网络抖动或连接重置, 限流失效, DeepSeek 被打爆风险"

          - alert: LLMPIISanitizeFailed
            expr: |
              sum by (logger, line) (
                count_over_time(
                  {service="backend", logger="app.services.llm_service"}
                  | line == "185"
                  | regexp("LLM PII 脱敏失败.*降级用原消息")
                  [5m]
                )
              ) > 0
            for: 30s
            labels:
              severity: critical
              category: llm
              fingerprint: LLM_PII_SANITIZE_FAILED
            annotations:
              summary: "LLM PII 脱敏失败, 降级用原消息"
              description: "PII 脱敏流程异常, 用户原始消息未脱敏直接调 DeepSeek, 数据安全风险"
