# 文件名：postgres.yaml 职责：PostgreSQL 生产 StatefulSet 部署清单,定义副本、镜像与凭证 Secret 引用
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fintrust
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-secrets, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secrets, key: postgres-password } }
            - name: POSTGRES_DB
              value: fintrust_hub
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "fintrust"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fintrust
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
