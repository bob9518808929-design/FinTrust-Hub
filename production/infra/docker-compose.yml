# FinTrust Hub 生产环境 Docker Compose
# 技术栈: PostgreSQL + Redis + ClickHouse + Neo4j + FastAPI + Nginx + Vite
# 使用: docker compose up -d

version: "3.9"

services:
  # === 基础设施 ===
  postgres:
    image: postgres:16-alpine
    container_name: fintrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintrust
      POSTGRES_PASSWORD: fintrust
      POSTGRES_DB: fintrust_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/postgresql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../db/postgresql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ../db/postgresql/03_indexes.sql:/docker-entrypoint-initdb.d/03_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrust -d fintrust_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintrust-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: fintrust-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: fintrust_metrics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: fintrust
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../db/clickhouse/01_metrics.sql:/docker-entrypoint-initdb.d/01_metrics.sql:ro

  neo4j:
    image: neo4j:5-community
    container_name: fintrust-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/fintrust
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ../db/neo4j/01_graph.cypher:/var/lib/neo4j/import/01_graph.cypher:ro

  # === 后端 ===
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: fintrust-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://fintrust:fintrust@postgres:5432/fintrust_hub
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: fintrust
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: fintrust
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # === 前端 ===
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: fintrust-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/fintrust.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  neo4j_data:
